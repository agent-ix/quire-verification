name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.94.0
      - run: cargo install cargo-deny --locked
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo run --locked --bin validate-fixtures
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo fuzz build -D --sanitizer none
      - run: cargo deny check
