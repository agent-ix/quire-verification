[package]
name = "quire-verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "Qualified-path verification contracts, planning, and evidence assessment"
repository = "https://github.com/agent-ix/quire-verification"

[features]
native-process-test-fixture = []
qualification-oracle-test-fixture = []

[[bin]]
name = "native-process-fixture"
path = "tests/support/native_process_fixture.rs"
required-features = ["native-process-test-fixture"]
test = false
bench = false
doc = false

[[test]]
name = "native_process"
path = "tests/native_process.rs"
required-features = ["native-process-test-fixture"]

[[test]]
name = "parser_portfolio"
path = "tests/parser_portfolio.rs"
required-features = ["native-process-test-fixture"]

[[bin]]
name = "qualification-oracle-fixture"
path = "tests/support/qualification_oracle_fixture.rs"
required-features = ["qualification-oracle-test-fixture"]
test = false
bench = false
doc = false

[[test]]
name = "qualification_oracle_execution"
path = "tests/qualification_oracle_execution.rs"
required-features = ["qualification-oracle-test-fixture"]

[lib]
name = "quire_verification"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["serde"] }
# PLAT-1007: rev is the exact commit the released v0.4.0 tag points to (build.rs
# requires a full commit SHA, not a `tag` key, so it can bake the pinned
# revision into ENGINEERING_ASSURANCE_REVISION for provenance).
engineering-assurance = { version = "=0.4.0", git = "https://github.com/agent-ix/engineering-assurance", rev = "438b30fcd5d4df457fe0fca4682b322c72856c1c", default-features = false, features = ["producer-execution"] }
quire-analyze-method-contract = { git = "https://github.com/agent-ix/quire-analyze", rev = "ddc099b918a6a569987c96cda97d567d2d3bba33", package = "quire-analyze-method-contract", version = "=0.1.0" }
quire-verification-contracts = { version = "=0.1.0", git = "https://github.com/agent-ix/quire-verification-contracts", rev = "be73336844cde3316c734edf18a629de2b4bcb55" }
rustix = { version = "1.1.2", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"

[build-dependencies]
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
# Used only by tests/shared_reference.rs to compile the "core.schema.json" fixture's own
# ad-hoc JSON Schema locally; the retained shared-reference v1/v2 schemas are validated
# through `contracts::shared_reference` (VER-50) and need no direct dependency here.
jsonschema = { version = "0.55.0", default-features = false }
proptest = "1.11.0"

[workspace]
members = ["fuzz"]
default-members = ["."]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true
