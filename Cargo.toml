[package]
name = "quire-verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
description = "Qualified-path verification contracts, planning, and evidence assessment"
repository = "https://github.com/agent-ix/quire-verification"

[lib]
name = "quire_verification"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["serde"] }
jsonschema = { version = "0.55.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
thiserror = "2.0.16"

[build-dependencies]
schemars = "0.8.22"
serde_json = "1.0.145"
typify = "0.7.0"

[dev-dependencies]
ix-trace-rs = { path = "vendor/ix-trace-rs", version = "=0.1.0" }
tempfile = "3.23.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true
