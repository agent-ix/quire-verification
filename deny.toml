[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "AGPL-3.0-or-later",
  "BSD-2-Clause",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Exact candidate source required for the EA #34 downstream-consumer gate. Replace the
# revision after provider promotion; unknown Git sources remain denied.
# quire-verification-contracts is the public E02 contracts boundary extracted from this
# crate (PLAT-861); quire-analyze supplies the analyze-method-contract type; ix-trace-rs
# is the de-vendored tracing dependency (PLAT-853).
allow-git = [
    "https://github.com/agent-ix/engineering-assurance",
    "https://github.com/agent-ix/ix-trace-rs",
    "https://github.com/agent-ix/quire-analyze",
    "https://github.com/agent-ix/quire-verification-contracts",
]
